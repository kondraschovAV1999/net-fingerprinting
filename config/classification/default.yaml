# Classical classification stage.
#
# models: which scikit-learn classifiers to run, with hyperparameters.
#   Available names: decision_tree, random_forest, linear, knn, svm.
models:
  - name: decision_tree
    enabled: false
    params: {}
  - name: random_forest
    enabled: true
    params: { n_estimators: 250 }
  - name: linear
    enabled: false
    params: { max_iter: 1000 }
  - name: knn
    enabled: true
    params: { n_neighbors: 10 }
  - name: svm
    enabled: false
    params: {}
  - name: xgboost
    enabled: true
    params: {}
  - name: lightgbm
    enabled: true
    params: {}

# zero_division for F1 / precision / recall on classes with no predictions.
zero_division: 0

# Restrict training to specific applications (case-insensitive). null = all.
applications: [ "Google Chrome", "Perplexity","Copilot", "Microsoft Edge", "Opera Mini"]

# Cap the number of pcaps per application (oldest first). null = no limit.
max_pcaps_per_app: 3

# Input / output paths.
combined_csv: data/processed/combined.csv
metrics_csv: output/classic/metrics.csv
models_dir: output/classic/models   # per-model confusion matrix + report
