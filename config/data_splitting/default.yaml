# Chronological, per-pcap, per-application data split.
#
# test_size: fraction of pcaps held out as test (newest); rest = train.
test_size: 0.15

# n_folds: null = single holdout split; N = N-fold cross-validation
# (StratifiedGroupKFold). Must be <= the smallest per-app pcap count.
n_folds: 3

# Random seed for CV fold shuffling.
seed: 42

# How to group PCAPs before the split:
#   - combined     : split each application across all datasets together
#   - per_dataset  : split each (dataset, application) independently
dataset_scope: combined
