[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-fingerprinting"
version = "0.1.0"
description = "Network fingerprinting framework"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "mlflow>=2.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "torch>=2.0",
    "lightning>=2.0",
    "requests>=2.28",
    "scapy>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
